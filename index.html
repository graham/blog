<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <script>
      // Apply the stored light/dark choice before the app loads to avoid a
      // flash of the wrong theme. Key matches src/lib/colorMode.ts.
      try {
        var mode = localStorage.getItem("blog-color-mode");
        if (mode !== "light" && mode !== "dark") {
          mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (mode === "dark") document.documentElement.dataset.theme = "ink";
        document.documentElement.style.colorScheme = mode;
      } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
